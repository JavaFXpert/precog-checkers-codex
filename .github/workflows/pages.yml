name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      # Install Playwright browsers and system deps (no deprecated action)
      - name: Install Playwright Browsers and dependencies
        run: npx playwright install --with-deps
      - name: Run E2E visual checks
        run: npm run test:e2e
      # Build with appropriate base: repo path on push, relative on PR previews
      - name: Set base path
        id: base
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "BASE=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
          else
            echo "BASE=./" >> $GITHUB_OUTPUT
          fi
      - run: npm run build -- --base=${{ steps.base.outputs.BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deployment.outputs.page_url }}';
            const body = `🚀 Preview deployed: ${url}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
